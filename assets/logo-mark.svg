<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- BCM stencil-plate monogram — "SIDE ALLEY" design system -->
  <g transform="rotate(-2 120 40)" fill="#e6e2d8">
    <!-- plate background hint -->
    <rect x="4" y="8" width="232" height="64" rx="2" fill="#131315" stroke="#26262a" stroke-width="1"/>
    <!-- B: stencil with bridges -->
    <g fill="#d4ff3f">
      <path d="M30 22 h16 a10 10 0 0 1 0 20 h-16 v-4 h16 a6 6 0 0 0 0-12 h-16 z"/>
      <path d="M30 42 h18 a10 10 0 0 1 0 20 h-18 v-4 h18 a6 6 0 0 0 0-12 h-18 z"/>
      <rect x="24" y="20" width="6" height="44"/>
    </g>
    <!-- C: stencil -->
    <g fill="#e6e2d8">
      <path d="M118 22 a22 22 0 1 0 0 40 v-6 a16 16 0 1 1 0-28 z" transform="translate(-6 0) scale(1 1)"/>
      <path d="M112 22 h18 v6 h-18 z M112 56 h18 v6 h-18 z"/>
    </g>
    <!-- M: stencil -->
    <g fill="#e6e2d8">
      <path d="M150 64 V20 h7 l13 22 13-22 h7 v44 h-7 V38 l-11 18 h-4 l-11-18 v26 z"/>
    </g>
    <!-- stencil bridges / cut lines -->
    <rect x="70" y="20" width="3" height="44" fill="#131315"/>
    <rect x="140" y="20" width="3" height="44" fill="#131315"/>
    <!-- registration tick, mono detail -->
    <rect x="206" y="16" width="18" height="2" fill="#8f2d23"/>
    <rect x="206" y="62" width="18" height="2" fill="#8f2d23"/>
  </g>
</svg>

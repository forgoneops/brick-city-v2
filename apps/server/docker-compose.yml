# Local development MySQL for Brick City Mashin' v2.
# Usage: docker compose -f apps/server/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8
    container_name: bcm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brickcity
      MYSQL_USER: bcm
      MYSQL_PASSWORD: bcm
    ports:
      - "3306:3306"
    volumes:
      - bcm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubcm", "-pbcm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bcm-mysql-data:

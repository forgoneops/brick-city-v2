services:
  mysql:
    image: mysql:8
    container_name: brickcity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: brickcity
      MYSQL_DATABASE: brickcity
    ports:
      - "3306:3306"
    volumes:
      - brickcity-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brickcity-mysql-data:
